[build-system]
requires = [
    "scikit-build-core==0.12.2",
    "pybind11==3.0.4"  # Pybind11 version should be synced with find_package(pybind11 ...) in CMakeLists.txt
]
build-backend = "scikit_build_core.build"

[project]
name = "tempestpy"
description = "TempestPy - Python bindings for Tempest with shield synthesis (fork of stormpy)"
readme = "README.md"
license.file = "LICENSE"
dynamic = ["version"]
authors = [
    { name = "S. Junges", email = "sebastian.junges@ru.nl" },
    { name = "M. Volk", email = "m.volk@tue.nl" },
    { name = "S. Pranger", email = "stefan.pranger@tugraz.at" },
]
requires-python = ">=3.10"  # Python version should be synced with find_package(Python ...) in CMakeLists.txt
dependencies = [
    "Deprecated",
    "loguru",
]
classifiers = [
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
]

[project.urls]
Homepage = "https://gitlab.tugraz.at/trustedai/tempestpy"
"Bug Tracker" = "https://gitlab.tugraz.at/trustedai/tempestpy/-/issues"
Upstream = "https://github.com/stormchecker/stormpy"

[project.optional-dependencies]
numpy = [
    "numpy"
]
plot = [
    "matplotlib",
    "numpy",
    "scipy",
]
doc = [
    "Sphinx>=8.2.2",
    "sphinx-nefertiti",
    "sphinx-copybutton",
    "nbsphinx",
    "ipython",
    "ipykernel",
    "myst-parser",
]  # also requires pandoc to be installed
dev = [
    # Formatting
    "black[jupyter]",
]
test = [
    "pytest",
    "nbval",
    "numpy",
]

[dependency-groups]
# Build requirements to install into the venv for incremental builds with --no-build-isolation. Keep in sync with build-system.requires.
incremental-builds = [
    "scikit-build-core==0.12.2",
    "pybind11==3.0.4",
]

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.install-dir = "stormpy"
cmake.args = [
]
wheel.packages = ["lib/stormpy", "lib/tempestpy"]
sdist.include = [
    "lib/stormpy/_config.py",
    "lib/stormpy/info/_config.py",
    "lib/stormpy/dft/_config.py",
    "lib/stormpy/gspn/_config.py",
    "lib/stormpy/pars/_config.py",
    "lib/stormpy/pomdp/_config.py",
    "lib/stormpy/pycarl/_config.py",
    "lib/stormpy/pycarl/cln/_config.py",
    "lib/stormpy/pycarl/cln/formula/_config.py",
    "lib/stormpy/pycarl/parse/_config.py",
    "lib/stormpy/pycarl/gmp/parse/_config.py",
    "lib/stormpy/pycarl/cln/parse/_config.py",
]

[tool.scikit-build.cmake.define]
STORM_DIR_HINT=""
ALLOW_STORM_SYSTEM="ON"
ALLOW_STORM_FETCH="ON"
USE_STORM_DFT="ON"
USE_STORM_GSPN="ON"
USE_STORM_PARS="ON"
USE_STORM_POMDP="ON"
USE_CLN_NUMBERS="ON"
USE_PARSER="ON"
CARLPARSER_DIR_HINT=""
COMPILE_WITH_CCACHE="ON"
STORMPY_DISABLE_SIGNATURE_DOC="OFF"
# The Tempest version that stormpy is built and tested against. This is the only place where the pin is defined;
# CMakeLists.txt reads these values. STORM_GIT_TAG is used for fetching, STORM_GIT_COMMIT for checking a found build.
STORM_GIT_REPO="https://gitlab.tugraz.at/trustedai/tempest.git"
STORM_GIT_TAG="9825bac32bf8e6b66108c11bf0b6498cdc9bb228"
STORM_GIT_COMMIT="9825bac32bf8e6b66108c11bf0b6498cdc9bb228"


[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "lib/tempestpy/_version.py"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
skip = "*musllinux*"

[tool.cibuildwheel.linux]
before-all = ".github/workflows/before-all-linux.sh"
repair-wheel-command = "auditwheel show --disable-isa-ext-check {wheel} && auditwheel repair --disable-isa-ext-check -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = ".github/workflows/before-all-macos.sh"
repair-wheel-command = "delocate-listdeps -vv --depending --all {wheel} && DYLD_LIBRARY_PATH=$REPAIR_LIBRARY_PATH delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.config-settings]
"cmake.args" = ["-DSTORM_PORTABLE=ON", "-DALLOW_STORM_SYSTEM='ON'", "-DALLOW_STORM_FETCH='OFF'", "-DSTORMPY_INFO_PRETEND_FETCH='ON'", "-DSTORM_STRICT=ON"]

[tool.black]
line-length = 160

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--doctest-glob='*.rst' --nbval"
testpaths = [
    "tests",
    "examples",
    "doc",
]
python_files = [
    "test*.py",
    "examples/*.py",
]
python_functions = [
    "*_test",
    "test_*",
    "example_*",
]
